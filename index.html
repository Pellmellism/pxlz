<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Editor 256x256 v2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            height: 100vh;
            background-color: #333;
            font-family: sans-serif;
            color: #eee;
            flex-direction: column; /* Stack controls, canvas, info */
            touch-action: none; /* Prevent browser touch actions like scrolling */
            position: fixed; /* Prevent iOS Safari bouncing effect */
            width: 100%;
        }
        #controls {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px;
            background-color: #444;
            border-radius: 5px;
            gap: 10px; /* Spacing between control groups */
            flex-wrap: wrap; /* Allow controls to wrap on narrow screens */
            justify-content: center; /* Center controls when wrapped */
            width: 90%; /* Take most of the width but not all */
            max-width: 600px; /* Limit maximum width on large screens */
        }
        .control-group {
             display: flex;
             align-items: center;
             gap: 5px; /* Spacing within a group */
        }
         .control-group span {
             font-size: 0.9em;
             margin-right: 5px;
         }

        .brush-selector, .color-selector {
            width: 30px;
            height: 30px;
            border: 2px solid #666;
            cursor: pointer;
            background-color: #555;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8em;
            border-radius: 3px;
             transition: border-color 0.2s ease; /* Smooth transition for active state */
        }
         /* Represent brush size visually */
         .brush-selector[data-brush="small"]::after { content: 'S'; }
         .brush-selector[data-brush="medium"]::after { content: 'M'; }
         .brush-selector[data-brush="large"]::after { content: 'L'; }


        .color-selector {
            width: 25px; /* Slightly smaller color swatches */
            height: 25px;
        }

        .brush-selector.active, .color-selector.active {
            border-color: #eee;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        #clearButton, #screenshotSafeButton {
            padding: 5px 10px;
            background-color: #555;
            border: 2px solid #666;
            color: #eee;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        #clearButton:hover, #screenshotSafeButton:hover {
            background-color: #666;
        }
        
        #screenshotSafeButton.active {
            background-color: #477;
            border-color: #699;
        }

        .message-container {
            margin: 10px 0;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        #messageInput {
            width: 100%;
            padding: 8px;
            border-radius: 3px;
            border: 1px solid #666;
            background-color: #444;
            color: #eee;
            font-size: 14px;
            text-align: center;
        }
        
        .color-picker {
            opacity: 0;
            position: absolute;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }

        canvas {
            display: block;
            background-color: #eee;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            cursor: crosshair; /* Indicate drawing area */
            touch-action: none; /* Prevent browser touch actions specifically on canvas */
            max-width: 100%; /* Ensure canvas doesn't overflow horizontally */
            max-height: calc(100vh - 150px); /* Limit height based on viewport, leaving room for UI */
        }
        #info {
            margin-top: 10px;
            font-size: 0.8em;
            min-height: 1.2em;
        }
    </style>
    <!-- Include libraries -->
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
    <div id="controls">
        <div class="control-group">
            <span>Brush:</span>
            <button class="brush-selector" data-brush="small" title="Small Brush (2x2)"></button>
            <button class="brush-selector" data-brush="medium" title="Medium Brush (~5x5)"></button>
            <button class="brush-selector" data-brush="large" title="Large Brush (~9x9)"></button>
        </div>
         <div class="control-group">
            <span>Color:</span>
            <div class="color-selector" data-color-index="0" title="Primary Color">
                <input type="color" class="color-picker" data-color-index="0" value="#000000">
            </div>
            <div class="color-selector" data-color-index="1" title="Secondary Color">
                <input type="color" class="color-picker" data-color-index="1" value="#FFFFFF">
            </div>
        </div>
        <div class="control-group">
            <button id="clearButton" title="Clear Canvas">Clear</button>
            <button id="screenshotSafeButton" title="Toggle Screenshot Safe Mode">Screenshot Safe</button>
        </div>
    </div>

    <canvas id="pixelCanvas"></canvas>
    <div class="message-container">
        <input type="text" id="messageInput" placeholder="Enter a message (max 100 chars)" maxlength="100">
    </div>
    <div id="info">URL Length: 0 chars</div>

    <script src="script.js"></script>
    <script src="utilities.js"></script>
    <script src="canvas-pan-util.js"></script>
    <script src="noise-shader.js"></script>
    <script>
        window.addEventListener('load', function() {
            console.log('%cLoad event fired. Initializing utilities...', 'color: blue; font-weight: bold;'); // Make it stand out
            console.log('Checking dependencies right before initialization:');
            console.log('typeof window.pixelEditorApp:', typeof window.pixelEditorApp);
            if (window.pixelEditorApp) {
                console.log('pixelEditorApp keys:', Object.keys(window.pixelEditorApp));
                console.log('typeof pixelEditorApp.getCanvas:', typeof window.pixelEditorApp.getCanvas);
            } else {
                 console.error('pixelEditorApp is NOT defined when load listener runs!');
            }
            console.log('typeof initUtilities:', typeof initUtilities);
            console.log('typeof initCanvasPanUtil:', typeof initCanvasPanUtil);
            console.log('--- Proceeding with initializations ---');
    
            // Initialize base utilities
            if (typeof initUtilities === 'function') {
                initUtilities();
            } else { /* error */ }
    
            // Initialize canvas pan utility
            if (typeof initCanvasPanUtil === 'function') {
                initCanvasPanUtil();
            } else { /* error */ }
    
            // Initialize noise shader
            if (typeof initNoiseShader === 'function') {
                initNoiseShader();
            } else { /* error */ }
    
            console.log('--- Utility initializations attempted ---');
        });
    </script>
</body>
</html>
